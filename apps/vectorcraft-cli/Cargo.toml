[package]
name = "vectorcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "StitchFoundry command line: MCP server (stdio) and headless batch runs"

[[bin]]
name = "stitchfoundry-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
# HEIC/HEIF photos (the engine's `heif` feature; off by default).
heif = ["vectorcraft-engine/heif"]

[dependencies]
# DWG drawings are converted in a helper copy of the program (sf-dwg).
sf-dwg = { workspace = true }
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-engine = { workspace = true, features = ["bundled-fonts"] }
vectorcraft-format = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-svg = { workspace = true }
vectorcraft-mcp = { workspace = true }
vectorcraft-render = { workspace = true }
vectorcraft-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `ai-eval` (src/ai_eval.rs): Design from Prompt's requests and the HTTPS client the desktop app
# sends them with (rustls, the system's certificates).
sf-core = { workspace = true }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
# `ai-eval --pictures`: the picture services' pictures, read and made into the JPEG Claude is sent.
image = { workspace = true }

# `perf` on Windows (src/perf.rs) reads how busy the processors are (GetSystemTimes) and this
# process's working set (GetProcessMemoryInfo) through winsafe's safe wrappers over Win32 (MIT),
# which the desktop app's src/gpu.rs also uses.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel", "psapi"] }

# DirectWrite's system font collection and GDI's font list (the desktop app's src/system_fonts.rs,
# shared): fonts that font services such as Adobe Fonts load in place (#579, #1258). MIT OR
# Apache-2.0.
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi"] }

# CoreText's font manager (the desktop app's src/mac_fonts.rs, shared): fonts that apps and font
# managers register from their own folders (#579). Zlib OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }

[dev-dependencies]
vectorcraft-testkit = { workspace = true }
serde_json = { workspace = true }
