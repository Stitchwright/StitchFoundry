version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/affinity/fuzz"
      - "/crates/plugins/example"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      # A dependency that matches several groups goes to the first one it matches, so the
      # lockstep families are listed before the catch-all cargo-patch group.
      # Families that must move together; all update types of a family land in one PR.
      egui-stack: # egui/eframe/winit are [patch.crates-io]'d to storytold forks: expect this PR red on upstream releases until the forks move
        patterns: ["egui*", "eframe", "epaint*", "ecolor", "emath", "winit", "wgpu*", "naga", "accesskit*"]
      font-stack:
        patterns: ["harfrust", "skrifa", "read-fonts", "font-types", "fontique", "parley", "write-fonts", "skera", "ttf-parser"]
      pdf-render-stack:
        patterns: ["hayro*", "krilla*", "vello*", "peniko", "kurbo", "resvg", "usvg", "tiny-skia*", "svgtypes"]
      icu-stack:
        patterns: ["icu_*", "fixed_decimal"]
      ml-stack:
        patterns: ["candle-*", "rten*", "ocrs"]
      platform-stack:
        patterns: ["zbus*", "zvariant*", "x11rb*"]
      apple-stack:
        patterns: ["objc2*", "block2", "dispatch2"]
      rustcrypto:
        patterns: ["aes", "sha1", "sha2", "sha3", "md-5", "hmac", "pbkdf2", "digest", "cipher"]
      # Everything else: patch bumps only (minor/major of other crates get one PR each).
      cargo-patch:
        update-types: ["patch"]
        patterns: ["*"]
    open-pull-requests-limit: 10
    # Updates held back on purpose (see the PR that added each rule). Remove a rule to try again.
    ignore:
      # egui/eframe/winit and friends are [patch.crates-io]'d to storytold forks: they move with
      # the forks, by hand, not on upstream releases.
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "epaint*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ecolor"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "emath"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "winit"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # vello 0.3 breaks root-level blend modes (a render test draws blue instead of white).
      - dependency-name: "vello_cpu"
        versions: [">= 0.3"]
      - dependency-name: "vello_common"
        versions: [">= 0.3"]
      # Pinned to the copies winit and accesskit bring in; bumping only ours builds a second copy.
      - dependency-name: "zbus"
        versions: [">= 6"]
      - dependency-name: "x11rb"
        versions: [">= 0.14"]
      # Password hashing: 0.6 reworks the password-hash API (salts, hash_password). Migrate on purpose.
      - dependency-name: "argon2"
        versions: [">= 0.6"]
      # harfrust 0.14+ replaces the shaping API (shape(), ShapeOptions); skrifa and write-fonts must
      # move with it (shared font types). Wait for VectorCraft upstream to migrate the text crate.
      - dependency-name: "harfrust"
        versions: [">= 0.14"]
      - dependency-name: "skrifa"
        versions: [">= 0.48"]
      - dependency-name: "write-fonts"
        versions: [">= 0.49"]
      # usvg/resvg 0.49 add the plus-lighter blend mode, which our document model can't hold yet.
      - dependency-name: "usvg"
        versions: [">= 0.49"]
      - dependency-name: "resvg"
        versions: [">= 0.49"]
      # The pinned craft-libs PDF crates still use 0.3; bumping ours alone builds two decoders.
      - dependency-name: "hayro-ccitt"
        versions: [">= 0.4"]
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
