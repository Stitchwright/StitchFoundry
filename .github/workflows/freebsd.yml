# FreeBSD build and package check in a QEMU VM.
name: FreeBSD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "packaging/freebsd/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "packaging/freebsd/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Upstream's CI: skipped in forks such as StitchFoundry.
    if: github.repository == 'storytold/vectorcraft'
    name: FreeBSD 14 (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The optional craft-fonts build input (Japanese fonts), so the tests that need it run here
      # rather than skip. Pinned; bump deliberately (craftrules standards/fonts.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: a71c20e30af613287c504f7e685ca8fad77752bc
          path: craft-fonts
      # The Foundry embroidery fonts, embedded by crates/embroidery/build.rs (STITCHFOUNDRY_FONTS_DIR):
      # only their fonts/ folder. Bump the commit deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stitchwright/stitchfoundry-fonts
          ref: 02459a144efc3c5e1f94f5e941ef0d4cd7874860
          path: stitchfoundry-fonts
          sparse-checkout: fonts
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          usesh: true
          cpu: 4
          mem: 12288
          # Nothing to bring back; copying the target dir out of the VM fails on large builds.
          copyback: false
          prepare: |
            pkg install -y git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            # The checkout is synced in under another owner; let tests that call git read it.
            git config --global --add safe.directory "*"
            rustc --version
            # The checkout above is synced into the VM with the workspace.
            export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1 STITCHFOUNDRY_FONTS_DIR="$PWD/stitchfoundry-fonts" STITCHFOUNDRY_FONTS_REQUIRED=1
            CARGO_PROFILE_DEV_DEBUG=0 cargo build --workspace --all-targets --locked
            CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked

  package:
    name: FreeBSD 14 (package)
    # The release build takes a while: only for PRs that touch FreeBSD packaging (or dependencies)
    # and on demand, not on every push to main.
    if: github.repository == 'storytold/vectorcraft' && (github.event_name != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Japanese, Chinese, Arabic and Thai fonts, embedded by crates/text/build.rs (CRAFT_FONTS_DIR in the VM).
      # Bump the commit deliberately; see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: a71c20e30af613287c504f7e685ca8fad77752bc
          path: craft-fonts
      # The Foundry embroidery fonts, embedded by crates/embroidery/build.rs (STITCHFOUNDRY_FONTS_DIR):
      # only their fonts/ folder. Bump the commit deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stitchwright/stitchfoundry-fonts
          ref: 02459a144efc3c5e1f94f5e941ef0d4cd7874860
          path: stitchfoundry-fonts
          sparse-checkout: fonts
      - name: Package in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          usesh: true
          mem: 12288
          prepare: |
            pkg install -y bash curl git pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "$PWD"
            # Build outside the checkout so only dist/ is copied back out of the VM.
            # The craft-fonts checkout is synced into the VM with the workspace.
            export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1 STITCHFOUNDRY_FONTS_DIR="$PWD/stitchfoundry-fonts" STITCHFOUNDRY_FONTS_REQUIRED=1
            export CARGO_TARGET_DIR=/var/tmp/vectorcraft-target CARGO_BUILD_JOBS=4
            bash packaging/freebsd/package.sh
            # Every part the package must have, the craft-fonts licences included.
            tar -tzf dist/release/stitchfoundry-*-freebsd-x86_64.tar.gz >/var/tmp/contents.txt
            for want in '/bin/stitchfoundry$' '/bin/stitchfoundry-cli$' '/share/applications/.*\.desktop$' '/share/icons/hicolor/' '/share/doc/stitchfoundry/NOTICE$' '/share/doc/stitchfoundry/OFL-.*\.txt$'; do
              grep -Eq "$want" /var/tmp/contents.txt || { echo "missing from the package: $want"; exit 1; }
            done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-package
          path: dist/release/*
          if-no-files-found: error
