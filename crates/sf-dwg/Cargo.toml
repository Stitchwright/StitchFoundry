[package]
name = "sf-dwg"
description = "DWG drawings for StitchFoundry's DXF import: a panic-guarded, size-capped wrapper round acadrust (MPL-2.0, used unmodified) that turns a DWG into DXF text; native only"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# acadrust memory-maps its input and reads in parallel: not on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pinned exactly: it parses untrusted files. MPL-2.0, used unmodified as a library (NOTICE).
acadrust = { version = "=0.6.7", default-features = false }

[lints]
workspace = true
