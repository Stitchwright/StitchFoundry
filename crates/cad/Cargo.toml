[package]
name = "vectorcraft-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft CAD interchange: a hand-written ASCII DXF writer (R12 to 2018), and DXF (ASCII and binary) and DWG import"

[lints]
workspace = true

[dependencies]
vectorcraft-geom = { workspace = true }
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-effects = { workspace = true }
vectorcraft-brush = { workspace = true }
vectorcraft-pathops = { workspace = true }
vectorcraft-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
# DWG drawings, turned into DXF text first (native only; on the web it answers an error).
sf-dwg = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
vectorcraft-text = { workspace = true, features = ["bundled-fonts"] }

# The DWG tests write their drawings with acadrust's DWG writer (from a DXF this crate exports).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acadrust = { version = "=0.6.8", default-features = false }
